<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!--
  LINE・Xなどでリンクを送ったときに出るカード画像（1200×630）の元。
  画像を作り直すときは tools/ogp/make-ogp.ps1 を実行する。
-->
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&family=Noto+Serif+JP:wght@900&family=Yuji+Syuku&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{
  position:relative;font-family:"Zen Maru Gothic",sans-serif;color:#fff4e6;
  background:
    radial-gradient(ellipse 60% 45% at 18% 100%,rgba(255,170,220,.55),transparent 70%),
    radial-gradient(ellipse 55% 40% at 85% 105%,rgba(255,150,210,.5),transparent 70%),
    radial-gradient(ellipse 40% 30% at 60% 88%,rgba(255,200,235,.35),transparent 70%),
    linear-gradient(180deg,#0b0930 0%,#18104f 25%,#341a7a 48%,#7a3aa8 70%,#c066b8 88%,#f0a0d0 100%);
}
.stars{position:absolute;inset:0;background-image:
  radial-gradient(2px 2px at 80px 60px,#fff,transparent),radial-gradient(1.5px 1.5px at 260px 130px,#fff,transparent),
  radial-gradient(2px 2px at 520px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 700px 110px,#fff,transparent),
  radial-gradient(2px 2px at 930px 70px,#fff,transparent),radial-gradient(1.5px 1.5px at 1120px 150px,#fff,transparent),
  radial-gradient(1.5px 1.5px at 400px 200px,#fff,transparent),radial-gradient(2px 2px at 1040px 230px,#fff,transparent);opacity:.8}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:90px;padding-bottom:10px}

/* ゲームのタイトル画面の牌と同じデザイン */
.stack{--u:118px;display:flex;flex-direction:column;align-items:center}
.ht{width:var(--u);height:calc(var(--u) * 1.3);border-radius:calc(var(--u) * .16);display:grid;place-items:center;margin-bottom:calc(var(--u) * .175);
  background:linear-gradient(170deg,#fffef9,#f4ebd4);font-family:"Noto Serif JP",serif;font-weight:900;font-size:calc(var(--u) * .775);line-height:1;
  box-shadow:inset 0 0 0 4px #fffdf7,inset 0 -4px 0 #e6dbc0,0 12px 0 #7cc9ae,0 16px 0 #4fae8e,0 28px 36px rgba(0,0,0,.4)}
.ht.a{color:#d6283a;transform:translate(22px,0) rotate(8deg)}
.ht.b{color:#2b2f5a;transform:translate(-8px,0) rotate(-3deg)}
.ht.c{color:#1f8a4c;margin-bottom:0}

.text{display:flex;flex-direction:column;gap:24px}
.kana{font-weight:900;font-size:30px;letter-spacing:.5em;color:#ffd27a}
.catch{font-family:"Yuji Syuku",serif;font-size:66px;line-height:1.3;letter-spacing:.04em;white-space:nowrap;color:#fff;text-shadow:0 0 22px rgba(255,140,190,.8)}
.sub{font-weight:700;font-size:30px;line-height:1.5;color:#fff4e6;text-shadow:0 2px 10px rgba(20,10,50,.6)}
.play{align-self:flex-start;margin-top:6px;padding:14px 34px;border-radius:999px;font-weight:900;font-size:30px;color:#3a1c00;
  background:linear-gradient(180deg,#ffe9a8,#ffc454 60%,#f0a030);box-shadow:0 6px 0 #b8701c,0 12px 24px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div class="stars"></div>
<div class="wrap">
  <div class="stack">
    <div class="ht a">転</div>
    <div class="ht b">落</div>
    <div class="ht c">牌</div>
  </div>
  <div class="text">
    <div class="kana">てんらくはい</div>
    <div class="catch">積んで、そろえて、<br>落とさない。</div>
    <div class="sub">麻雀牌を積み上げて役をつくる<br>ブラウザでそのまま遊べるゲーム</div>
    <div class="play">▶ タップですぐ遊べる</div>
  </div>
</div>
</body>
</html>
